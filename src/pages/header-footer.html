<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Header & Footer - StrixPDF</title>
    <meta name="description"
        content="Add headers and footers to your PDF documents with dynamic page numbers. Free, secure, and runs entirely in your browser.">
    <link rel="icon" type="image/png" href="/images/favicon.svg" />
    <link rel="alternate" hreflang="en" href="/en/header-footer.html" />
    <link rel="alternate" hreflang="de" href="/de/header-footer.html" />
    <link rel="alternate" hreflang="vi" href="/vi/header-footer.html" />
    <link rel="alternate" hreflang="x-default" href="/en/header-footer.html" />
    <link href="/src/css/styles.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
</head>

<body class="antialiased bg-gray-50">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center cursor-pointer" id="home-logo">
                    <img src="/images/favicon.svg" alt="StrixPDF Logo" class="h-8 w-8" />
                    <span class="text-gray-900 font-bold text-xl ml-2">
                        <a href="/">StrixPDF</a>
                    </span>
                </div>

                <div class="hidden md:flex items-center space-x-8 text-gray-900">
                    
                    
                    
                    <a href="/" class="nav-link" data-i18n="nav.allTools">All Tools</a>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-button" type="button"
                        class="inline-flex items-center justify-center p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 transition-colors"
                        aria-controls="mobile-menu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <svg id="menu-icon" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg id="close-icon" class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
            <div class="px-2 pt-2 pb-3 space-y-1 text-center">
                
                
                
                <a href="/" class="mobile-nav-link" data-i18n="nav.allTools">All Tools</a>
            </div>
        </div>
    </nav>

    <div id="uploader" class="min-h-screen flex flex-col items-center justify-start py-12 p-4 bg-gray-50">
        <div id="tool-uploader"
            class="bg-white rounded-xl shadow-xl px-4 py-8 md:p-8 max-w-2xl w-full text-gray-800 border border-gray-200">
            <button id="back-to-tools"
                class="flex items-center gap-2 text-indigo-600 hover:text-indigo-800 mb-6 font-semibold">
                <i data-lucide="arrow-left" class="cursor-pointer"></i>
                <span class="cursor-pointer" data-i18n="tools.backToTools"> Back to Tools </span>
            </button>

            <h1 class="text-2xl font-bold text-gray-900 mb-2" data-i18n="tools:headerFooter.name">Add Header & Footer</h1>
            <p class="text-gray-600 mb-6" data-i18n="tools:headerFooter.subtitle">
                Add customizable headers and footers to your PDF documents with dynamic page numbers.
            </p>

            <div id="drop-zone"
                class="relative flex flex-col items-center justify-center w-full h-48 md:h-64 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors duration-300">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <i data-lucide="upload-cloud" class="w-10 h-10 mb-3 text-gray-600"></i>
                    <p class="mb-2 text-sm text-gray-600"><span class="font-semibold"
                            data-i18n="upload.clickToSelect">Click to select a file</span> <span
                            data-i18n="upload.orDragAndDrop">or drag and drop</span></p>
                    <p class="text-xs text-gray-500">PDF file</p>
                    <p class="text-xs text-gray-500" data-i18n="upload.filesNeverLeave">Your files never leave your
                        device.</p>
                </div>
                <input id="file-input" type="file" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
                    accept="application/pdf">
            </div>

            <div id="file-display-area" class="mt-4 space-y-2"></div>

            <div id="options-panel" class="hidden mt-6 space-y-6">
                <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
                    <h3 class="text-sm font-semibold text-gray-700 mb-4">Formatting Options</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label for="page-range" class="block mb-2 text-sm font-medium text-gray-700">Page Range
                                (optional)</label>
                            <input type="text" id="page-range" placeholder="e.g., 1-3, 5"
                                class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                            <p class="text-xs text-gray-600 mt-1">Total pages: <span id="total-pages">0</span></p>
                        </div>
                        <div>
                            <label for="font-size" class="block mb-2 text-sm font-medium text-gray-700">Font
                                Size</label>
                            <input type="number" id="font-size" value="10" min="6" max="24"
                                class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                        </div>
                        <div>
                            <label for="font-color" class="block mb-2 text-sm font-medium text-gray-700">Font
                                Color</label>
                            <input type="color" id="font-color" value="#000000"
                                class="w-full h-[42px] bg-gray-100 border border-gray-300 rounded-lg p-1 cursor-pointer">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="header-left" class="block mb-2 text-sm font-medium text-gray-700">Header
                            Left</label>
                        <input type="text" id="header-left" placeholder=""
                            class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label for="header-center" class="block mb-2 text-sm font-medium text-gray-700">Header
                            Center</label>
                        <input type="text" id="header-center" placeholder=""
                            class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label for="header-right" class="block mb-2 text-sm font-medium text-gray-700">Header
                            Right</label>
                        <input type="text" id="header-right" placeholder=""
                            class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="footer-left" class="block mb-2 text-sm font-medium text-gray-700">Footer
                            Left</label>
                        <input type="text" id="footer-left" placeholder=""
                            class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label for="footer-center" class="block mb-2 text-sm font-medium text-gray-700">Footer
                            Center</label>
                        <input type="text" id="footer-center" placeholder=""
                            class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label for="footer-right" class="block mb-2 text-sm font-medium text-gray-700">Footer
                            Right</label>
                        <input type="text" id="footer-right" placeholder=""
                            class="w-full bg-gray-100 border border-gray-300 text-gray-900 rounded-lg p-2.5">
                    </div>
                </div>

                <button id="process-btn" class="btn-gradient w-full mt-4">Add Header & Footer</button>
            </div>

        </div>
    </div>

    <div id="loader-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg flex flex-col items-center gap-4 border border-gray-200 shadow-xl">
            <div class="solid-spinner"></div>
            <p id="loader-text" class="text-gray-900 text-lg font-medium" data-i18n="loader.processing"
                data-i18n="loader.processing">Processing...</p>
        </div>
    </div>

    <div id="alert-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full border border-gray-200">
            <h3 id="alert-title" class="text-xl font-bold text-gray-900 mb-2" data-i18n="alert.title"
                data-i18n="alert.title">Alert</h3>
            <p id="alert-message" class="text-gray-700 mb-6"></p>
            <button id="alert-ok"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200">
                OK
            </button>
        </div>
    </div>

    
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/version.ts"></script>
    <script type="module" src="/src/js/logic/header-footer-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
</body>

</html>
